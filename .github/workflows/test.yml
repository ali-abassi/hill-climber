name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
