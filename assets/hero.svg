<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Hill Climber candidate selection flow</title>
  <desc id="desc">Five isolated Codex candidates leave the same baseline. A detached evaluator keeps one winner, a private holdout verifies it, and only then is its patch promoted.</desc>
  <defs>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.label{font-size:13px;font-weight:700;letter-spacing:1.8px}.body{font-size:17px;font-weight:600}.small{font-size:13px}.muted{fill:#8b949e}.bright{fill:#f0f6fc}.green{fill:#3fb950}.stroke{stroke:#30363d}.route{fill:none;stroke:#484f58;stroke-width:2}.winner{fill:none;stroke:#3fb950;stroke-width:4}
    </style>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#0d1117"/>
  <g class="sans">
    <text x="54" y="54" class="label muted">ONE IMMUTABLE BASELINE</text>
    <rect x="54" y="78" width="210" height="364" rx="18" fill="#161b22" class="stroke" stroke-width="1"/>
    <g transform="translate(82 110)">
      <path fill="#21262d" d="M72 0 142 136H2L72 0Z"/>
      <g fill="none" stroke="#3fb950" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 124c8-20 19-28 47-41M48 124c5-18 11-27 23-41M72 124V83M96 124c-5-18-11-27-25-41M120 124c-8-20-19-28-49-41" stroke-width="4"/>
        <path d="M71 83c-7-12-5-22 7-30 11-8 12-18 3-30" stroke-width="7"/>
      </g>
      <path fill="#3fb950" d="m81 17 9 4-8 4-1-8Z"/>
    </g>
    <text x="82" y="300" class="body bright">Your clean Git commit</text>
    <text x="82" y="328" class="small muted">Measured before search</text>
    <g class="mono small">
      <text x="82" y="374" class="muted">mutable</text><text x="150" y="374" class="bright">src/**/*.py</text>
      <text x="82" y="402" class="muted">round</text><text x="150" y="402" class="bright">1 of 1</text>
    </g>

    <text x="324" y="54" class="label muted">FIVE ISOLATED ROUTES</text>
    <g class="mono small">
      <rect x="324" y="78" width="248" height="54" rx="12" fill="#161b22" class="stroke"/><circle cx="348" cy="105" r="6" fill="#58a6ff"/><text x="366" y="110" class="bright">01  root cause</text>
      <rect x="324" y="148" width="248" height="54" rx="12" fill="#161b22" class="stroke"/><circle cx="348" cy="175" r="6" fill="#58a6ff"/><text x="366" y="180" class="bright">02  edge coverage</text>
      <rect x="324" y="218" width="248" height="64" rx="12" fill="#17251d" stroke="#3fb950"/><circle cx="348" cy="250" r="7" fill="#3fb950"/><text x="366" y="255" class="bright">03  strict gain</text><text x="512" y="255" class="green">KEPT</text>
      <rect x="324" y="298" width="248" height="54" rx="12" fill="#161b22" class="stroke"/><circle cx="348" cy="325" r="6" fill="#58a6ff"/><text x="366" y="330" class="bright">04  alternative</text>
      <rect x="324" y="368" width="248" height="54" rx="12" fill="#161b22" class="stroke"/><circle cx="348" cy="395" r="6" fill="#58a6ff"/><text x="366" y="400" class="bright">05  adversarial</text>
    </g>

    <path class="route" d="M572 105C650 105 632 225 704 242M572 175C638 175 646 225 704 242M572 325C638 325 646 260 704 246M572 395C650 395 632 265 704 246"/>
    <path class="winner" d="M572 250C630 250 650 244 704 244"/>

    <g filter="url(#soft)">
      <rect x="704" y="176" width="214" height="136" rx="18" fill="#161b22" stroke="#3fb950"/>
      <text x="730" y="210" class="label green">PRIVATE HOLDOUT</text>
      <text x="730" y="248" class="body bright">Verify once</text>
      <text x="730" y="277" class="small muted">Retain baseline on regression</text>
    </g>
    <path class="winner" d="M918 244H974"/>
    <circle cx="982" cy="244" r="8" fill="#3fb950"/>

    <g filter="url(#soft)">
      <rect x="1000" y="176" width="146" height="136" rx="18" fill="#17251d" stroke="#3fb950"/>
      <text x="1025" y="214" class="label green">PROMOTED</text>
      <path d="m1032 250 17 17 38-42" fill="none" stroke="#3fb950" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1025" y="290" class="small bright">Patch may apply</text>
    </g>

    <text x="324" y="469" class="small muted">Codex proposes. Deterministic evaluators decide. The source changes only after promotion.</text>
  </g>
</svg>
